name: Atlas
options:
  bundleIdPrefix: ai.sofsuite
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only — iPad out of scope
    DEVELOPMENT_TEAM: "" # set your team, or leave blank for a simulator build
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

# Prototype: no backend yet. Supabase (auth/db/storage) gets added here when we
# wire the real backend — see DECISIONS.md.

targets:
  Atlas:
    type: application
    platform: iOS
    sources:
      - path: Atlas
        # River.metal needs the on-demand Metal Toolchain to compile. It's an
        # optional ripple (Config.useShaders); excluded so the prototype builds
        # without that component. Re-include + flip useShaders on to enable it.
        excludes:
          - "**/*.metal"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.sofsuite.atlas
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Atlas/Info.plist
      properties:
        CFBundleDisplayName: Atlas
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: ai.sofsuite.atlas
            CFBundleURLSchemes:
              - atlas

  AtlasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AtlasTests
    dependencies:
      - target: Atlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.sofsuite.atlas.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Atlas:
    build:
      targets:
        Atlas: all
        AtlasTests: [test]
    test:
      targets:
        - AtlasTests
